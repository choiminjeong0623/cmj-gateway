server:
  port: 8080

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # auth-server가 공개하는 공개키 목록. gateway는 이걸로 서명·만료만 확인한다.
          jwk-set-uri: http://auth-server:9000/oauth2/jwks
  cloud:
    gateway:
      routes:
        # 로그인·재발급·로그아웃: 인증 서버에 만든 로그인 API (🟩 2026-11-26 — /oauth2/token 이 아니었음)
        # 공개키(/oauth2/jwks)는 gateway가 내부 주소(jwk-set-uri)로 직접 받으므로 바깥에 열지 않음
        - id: auth-api
          uri: http://auth-server:9000
          predicates:
            - Path=/api/auth/**
        # 비밀번호 변경(로그인 후)·재설정(로그인 전) — ✅ 재설정은 시큐리티 서버에 작성 (포털 앱은 로그인한 사용자만 들어갈 수 있어서)
        - id: security-password
          uri: http://security-server:9100
          predicates:
            - Path=/api/security/password,/api/security/password-reset/**
        - id: portal-api                     # 포털 공통·관리자·라벨 (공통·포털팀)
          uri: http://portal-api:8082
          predicates:
            - Path=/api/portal/**,/api/admin/**,/api/public/**
        - id: tax-return                     # 업무 서비스 예시 (각 업무팀) — common-security만 추가하면 같은 검사가 붙음
          uri: http://tax-return-service:8081
          predicates:
            - Path=/api/tax-return/**
